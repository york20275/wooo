<link rel="stylesheet" href="/style.css">
<script>
  try {
    var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
    var o = localStorage.getItem('op'); if (o) document.documentElement.style.setProperty('--op', o);
    if (localStorage.getItem('large') === '1') document.documentElement.classList.add('large');
  } catch (e) {}
</script>
</head>
